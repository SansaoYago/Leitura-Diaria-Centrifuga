<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="contain">
        <main>
            <h1>Leitura Dária de Rotina de Centrífugas</h1>
            <form>

                <section>
                    <label for="inNome">
                        <p>
                            Funcionário
                        </p>
                        <input type="text" name="inNome" id="inNome" autofocus>
                    </label>
                    <select name="chiller" id="chiller">
                        <option value="1.1">CH1.1</option>
                        <option value="1.2">CH1.2</option>
                        <option value="1.3">CH1.3</option>
                        <option value="2.1">CH2.1</option>
                        <option value="2.2">CH2.2</option>
                        <option value="C1">CH.C1</option>
                    </select>
                </section>

                <fieldset>
                    <legend>GELADA</legend>
                    <label for="inTemp-entrada-GEL">
                        <p>
                            Temp. de entrada
                        </p>
                        <input type="number" name="inTemp-entrada-GEL" id="inTemp-entrada-GEL" placeholder="°C" step="0.01">
                    </label>
                    <label for="inTemp-saida-GEL">
                        <p>
                            Temp. de saída
                        </p>
                        <input type="number" name="inTemp-saida-GEL" id="inTemp-saida-GEL" placeholder="°C" step="0.01">
                    </label>
                    <label for="inPress-entrada-GEL">
                        <p>
                            Pressão de entrada
                        </p>
                        <input type="number" name="inPress-entrada-GEL" id="inPress-entrada-GEL"
                            placeholder="Kg/cm&sup2" step="0.01">
                    </label>
                    <label for="inPress-saida-GEL">
                        <p>
                            Pressão de saída
                        </p>
                        <input type="number" name="inPress-saida-GEL" id="inPress-saida-GEL" placeholder="Kg/cm&sup2" step="0.01">
                    </label>
                </fieldset>

                <fieldset>
                    <legend>EVAPORAÇÃO</legend>
                    <label for="inDeltaEvap">
                        <p>
                            Delta de Temp. Approach (Evaporação)
                        </p>
                        <input type="number" name="inDeltaEvap" id="inDeltaEvap" placeholder="°C" step="0.01">
                    </label>
                </fieldset>

                <fieldset>
                    <legend>CONDENSAÇÃO</legend>
                    <label for="inTemp-entrada-CON">
                        <p>
                            Temp. de entrada
                        </p>
                        <input type="number" name="inTemp-entrada-CON" id="inTemp-entrada-CON" placeholder="°C" step="0.01">
                    </label>
                    <label for="inTemp-saida-CON">
                        <p>
                            Temp. de saída
                        </p>
                        <input type="number" name="inTemp-saida-CON" id="inTemp-saida-CON" placeholder="°C" step="0.01">
                    </label>
                    <label for="inDeltaCond">
                        <p>
                            Delta de Temp. Approach (Condenser)
                        </p>
                        <input type="number" name="inDeltaCond" id="inDeltaCond" placeholder="°C" step="0.01">
                    </label>
                    <label for="inPress-entrada-CON">
                        <p>
                            Pressão de entrada
                        </p>
                        <input type="number" name="inPress-entrada-CON" id="inPress-entrada-CON"
                            placeholder="Kg/cm&sup2" step="0.01">
                    </label>
                    <label for="inPress-saida-CON">
                        <p>
                            Pressão de saída
                        </p>
                        <input type="number" name="inPress-saida-CON" id="inPress-saida-CON" placeholder="Kg/cm&sup2" step="0.01">
                    </label>
                </fieldset>


                <fieldset>
                    <legend>LUBRIF</legend>
                    <label for="inTempOleo">
                        <p>
                            Temp. do Óleo
                        </p>
                        <input type="number" name="inTempOleo" id="inTempOleo" placeholder="°C" step="0.01">
                    </label>
                    <label for="inPress-util">
                        <p>
                            Pressão Util do Óleo
                        </p>
                        <input type="number" name="inPress-util" id="inPress-util" placeholder="KPA" step="0.01">
                    </label>
                    <label for="inNivel-oleo-carter">
                        <p>
                            Nível do óleo do cárter
                        </p>
                        <input type="text" name="inNivel-oleo-carter" id="inNivel-oleo-carter"
                            placeholder="0,1/4,1/2 3/4 CH" step="0.01">
                    </label>
                </fieldset>

                <fieldset>
                    <legend>REFRIGERANTE</legend>
                    <label for="inPress-evap">
                        <p>
                            Pressão de Evaporação
                        </p>
                        <input type="number" name="inPress-evap" id="inPress-evap" placeholder="KPA" step="0.01">
                    </label>
                    <label for="inPress-cond">
                        <p>
                            Pressão de Condensação
                        </p>
                        <input type="number" name="inPress-cond" id="inPress-cond" placeholder="KPA" step="0.01">
                    </label>
                    <label for="inTemp-evap">
                        <p>
                            Temperatura de Evaporação
                        </p>
                        <input type="number" name="inTemp-evap" id="inTemp-evap" placeholder="°C" step="0.01">
                    </label>
                    <label for="inTemp-cond">
                        <p>
                            Temperatura de Condensação
                        </p>
                        <input type="number" name="inTemp-cond" id="inTemp-cond" placeholder="°C" step="0.01">
                    </label>
                </fieldset>

                <fieldset>
                    <legend>ELÉTRICA</legend>
                    <label for="inABRS">
                        <p>
                            ABST
                        </p>
                        <input type="number" name="inABRS" id="inABRS" placeholder="VOLTS" step="0.01">
                    </label>
                    <label for="inACST">
                        <p>
                            ACST
                        </p>
                        <input type="number" name="inACST" id="inACST" placeholder="VOLTS" step="0.01">
                    </label>
                    <label for="inBCRT">
                        <p>
                            BCRT
                        </p>
                        <input type="number" name="inBCRT" id="inBCRT" placeholder="VOLTS" step="0.01">
                    </label>
                    <label for="inA">
                        <p>
                            A
                        </p>
                        <input type="number" name="inA" id="inA" placeholder="AMPERES" step="0.01">
                    </label>
                    <label for="inB">
                        <p>
                            B
                        </p>
                        <input type="number" name="inB" id="inB" placeholder="AMPERES" step="0.01">
                    </label>
                    <label for="inC">
                        <p>
                            C
                        </p>
                        <input type="number" name="inC" id="inC" placeholder="AMPERES" step="0.01">
                    </label>
                    <label for="inDemanda">
                        <p>
                            % de Demanda
                        </p>
                        <input type="number" name="inDemanda" id="inDemanda" step="0.01">
                    </label>
                </fieldset>
                <p>
                    Ronda na torre de resfriamento
                </p>
                <label for="inRondaOk">
                    <input type="radio" class="Ok" name="ronda" id="inRondaOk" value="ok"> Ok
                </label> <br>
                <label for="inRondaNOk">
                    <input type="radio" class="NOk" name="ronda" id="inRondaNOk" value="nok"> NOk
                </label>
                <footer><input type="submit" value="REGISTRAR"></footer>
            </form>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="js/develop.js"></script>
</body>

</html>
