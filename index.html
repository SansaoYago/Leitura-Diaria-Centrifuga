<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            padding: 10px;
        }

        fieldset {
            padding: 15px;
            
            margin-bottom: 10px;
        }

        main {
            width: fit-content;
            margin: auto;
            padding: 5px;
            background-color: rgba(128, 128, 128, 0.582);
        }

        h1 {
            font-size: 1em;
            text-align: center;
            padding: 4px 0px;
        }

        input[type="number"]:focus {
            background-color: rgba(51, 234, 206, 0.399);
        }

        p {
            padding: 10px 0px;
        }

    </style>
</head>

<body>
    <div class="contain">
        <main>
            <h1>Leitura Dária de Rotina de Centrífugas</h1>
            <form>

                <fieldset>
                    <legend>GELADA</legend>
                    <label for="inTemp-entrada-GEL">
                        <p>
                            Temp. de entrada
                        </p>
                        <input type="number" name="inTemp-entrada-GEL" id="inTemp-entrada-GEL" placeholder="C°">
                    </label>
                    <label for="inTemp-saida-GEL">
                        <p>
                            Temp. de saída
                        </p>
                        <input type="number" name="inTemp-saida-GEL" id="inTemp-saida-GEL" placeholder="C°">
                    </label>
                    <label for="inPress-entrada-GEL">
                        <p>
                            Pressão de entrada
                        </p>
                        <input type="number" name="inPress-entrada-GEL" id="inPress-entrada-GEL"
                            placeholder="Kg/cm&sup2">
                    </label>
                    <label for="inPress-saida-GEL">
                        <p>
                            Pressão de saída
                        </p>
                        <input type="number" name="inPress-saida-GEL" id="inPress-saida-GEL" placeholder="Kg/cm&sup2">
                    </label>
                </fieldset>

                <fieldset>
                    <legend>EVAPORAÇÃO</legend>
                    <label for="inDeltaEvap">
                        <p>
                            Delta de Temp. Approach (Evaporação)
                        </p>
                        <input type="number" name="inDeltaEvap" id="inDeltaEvap" placeholder="C°">
                    </label>
                </fieldset>


                <fieldset>
                    <legend>CONDENSAÇÃO</legend>
                    <label for="inTemp-entrada-CON">
                        <p>
                            Temp. de entrada
                        </p>
                        <input type="number" name="inTemp-entrada-CON" id="inTemp-entrada-CON" placeholder="C°">
                    </label>
                    <label for="inTemp-saida-CON">
                        <p>
                            Temp. de saída
                        </p>
                        <input type="number" name="inTemp-saida-CON" id="inTemp-saida-CON" placeholder="C°">
                    </label>
                    <label for="inDeltaCond">
                        <p>
                            Delta de Temp. Approach (Condenser)
                        </p>
                        <input type="number" name="inDeltaCond" id="inDeltaCond" placeholder="C°">
                    </label>
                    <label for="inPress-entrada-CON">
                        <p>
                            Pressão de entrada
                        </p>
                        <input type="number" name="inPress-entrada-CON" id="inPress-entrada-CON"
                            placeholder="Kg/cm&sup2">
                    </label>
                    <label for="inPress-saida-CON">
                        <p>
                            Pressão de saída
                        </p>
                        <input type="number" name="inPress-saida-CON" id="inPress-saida-CON" placeholder="Kg/cm&sup2">
                    </label>
                </fieldset>


                <fieldset>
                    <legend>LUBRIF</legend>
                    <label for="inTempOleo">
                        <p>
                            Temp. do Óleo
                        </p>
                        <input type="number" name="inTempOleo" id="inTempOleo" placeholder="C°">
                    </label>
                    <label for="inPress-util">
                        <p>
                            Pressão Util do Óleo
                        </p>
                        <input type="number" name="inPress-util" id="inPress-util" placeholder="KPA">
                    </label>
                    <label for="inNivel-oleo-carter">
                        <p>
                            Nível do óleo do cárter
                        </p>
                        <input type="number" name="inNivel-oleo-carter" id="inNivel-oleo-carter"
                            placeholder="0,1/4,1/2 3/4 CH">
                    </label>
                </fieldset>

                <fieldset>
                    <legend>REFRIGERANTE</legend>
                    <label for="inPress-evap">
                        <p>
                            Pressão de Evaporação
                        </p>
                        <input type="number" name="inPress-evap" id="inPress-evap" placeholder="KPA">
                    </label>
                    <label for="inPress-cond">
                        <p>
                            Pressão de Condensação
                        </p>
                        <input type="number" name="inPress-cond" id="inPress-cond" placeholder="KPA">
                    </label>
                    <label for="inTemp-evap">
                        <p>
                            Temperatura de Evaporação
                        </p>
                        <input type="number" name="inTemp-evap" id="inTemp-evap" placeholder="C°">
                    </label>
                    <label for="inTemp-cond">
                        <p>
                            Temperatura de Condensação
                        </p>
                        <input type="number" name="inTemp-cond" id="inTemp-cond" placeholder="C°">
                    </label>
                </fieldset>
                
                <fieldset>
                    <legend>ELÉTRICA</legend>
                    <label for="inABRS">
                        <p>
                            ABST
                        </p>
                        <input type="number" name="inABRS" id="inABRS" placeholder="VOLTS">
                    </label>
                    <label for="inACST">
                        <p>
                            ACST
                        </p>
                        <input type="number" name="inACST" id="inACST" placeholder="VOLTS">
                    </label>
                    <label for="inBCRT">
                        <p>
                            BCRT
                        </p>
                        <input type="number" name="inBCRT" id="inBCRT" placeholder="VOLTS">
                    </label>
                    <label for="inA">
                        <p>
                            A
                        </p>
                        <input type="number" name="inA" id="inA" placeholder="AMPERES">
                    </label>
                    <label for="inB">
                        <p>
                            B
                        </p>
                        <input type="number" name="inB" id="inB" placeholder="AMPERES">
                    </label>
                    <label for="inC">
                        <p>
                            C
                        </p>
                        <input type="number" name="inC" id="inC" placeholder="AMPERES">
                    </label>
                    <label for="inDemanda">
                        <p>
                            % de Demanda
                        </p>
                        <input type="number" name="inDemanda" id="inDemanda">
                    </label>
                </fieldset>

            </form>
        </main>
    </div>
</body>

</html>
